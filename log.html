<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB Ads Research — Logfile Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width: 100%;
  height: 100%;
  background: #090b10;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}
.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
/* Header */
.header {
  background: #11141f;
  border-bottom: 1px solid #1e2438;
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header h1 {
  font-size: 1.15rem;
  font-weight: 700;
  color: #f8fafc;
  display: flex;
  align-items: center;
  gap: 8px;
}
.badge-status {
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: .5px;
}
.status-IDLE { background: #1e293b; color: #94a3b8; }
.status-RUNNING { background: #1e3a5f; color: #60a5fa; }
.status-PAUSED { background: #422006; color: #fbbf24; }
.status-STOPPED { background: #450a0a; color: #fca5a5; }
.status-COMPLETED { background: #052e16; color: #4ade80; }

/* Stats Bar */
.stats-bar {
  display: flex;
  gap: 16px;
  align-items: center;
  font-size: 0.82rem;
}
.stat-pill {
  background: #181d2c;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #232a40;
}
.stat-pill b {
  margin-left: 4px;
}

/* Toolbar */
.toolbar {
  background: #131724;
  border-bottom: 1px solid #1f253a;
  padding: 8px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.toolbar-left, .toolbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
select, input[type=text] {
  background: #1c2236;
  border: 1px solid #2f3754;
  border-radius: 5px;
  color: #e2e8f0;
  padding: 5px 10px;
  font-size: 0.82rem;
  outline: none;
  color-scheme: dark;
}
select:focus, input[type=text]:focus {
  border-color: #6366f1;
}
.btn {
  background: #252d47;
  border: 1px solid #364166;
  color: #e2e8f0;
  padding: 5px 12px;
  font-size: 0.82rem;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 500;
}
.btn:hover {
  background: #323b5c;
  border-color: #4f5d8c;
}
.btn-danger {
  background: #3b1818;
  border-color: #612222;
  color: #fca5a5;
}
.btn-danger:hover {
  background: #4f1e1e;
}
.toggle-scroll {
  font-size: 0.8rem;
  color: #94a3b8;
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  user-select: none;
}

/* Log Area */
.log-container {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
  font-size: 0.82rem;
  line-height: 1.6;
  background: #090b10;
}
.log-entry {
  display: flex;
  gap: 10px;
  padding: 3px 6px;
  border-radius: 3px;
  border-bottom: 1px solid #141824;
  transition: background 0.1s;
}
.log-entry:hover {
  background: #131724;
}
.log-time {
  color: #64748b;
  flex-shrink: 0;
  min-width: 70px;
}
.log-badge {
  flex-shrink: 0;
  min-width: 60px;
  text-align: center;
  border-radius: 3px;
  padding: 0 6px;
  font-weight: 700;
  font-size: 0.74rem;
  line-height: 1.5;
}
.log-msg {
  color: #cbd5e1;
  word-break: break-word;
  flex: 1;
}

/* Badges */
.log-RUNNING .log-badge { background: #1e3a5f; color: #60a5fa; }
.log-PASS .log-badge    { background: #052e16; color: #4ade80; }
.log-SKIP .log-badge    { background: #422006; color: #fbbf24; }
.log-ERROR .log-badge   { background: #450a0a; color: #fca5a5; }
.log-SAVED .log-badge   { background: #2e1065; color: #c084fc; }
.log-INFO .log-badge    { background: #1e293b; color: #94a3b8; }
.log-WARN .log-badge    { background: #422006; color: #fb923c; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #0c0e15; }
::-webkit-scrollbar-thumb { background: #2b324a; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3c4667; }
</style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <h1>📋 FB Ads Research — Logfile Dashboard</h1>
      <span id="stateBadge" class="badge-status status-IDLE">IDLE</span>
      <span id="currentProcessInfo" style="font-size:0.8rem;color:#818cf8;font-weight:500">—</span>
    </div>
    <div class="stats-bar">
      <div class="stat-pill">Tổng dòng: <b id="statTotal" style="color:#f8fafc">0</b></div>
      <div class="stat-pill">PASS: <b id="statPass" style="color:#4ade80">0</b></div>
      <div class="stat-pill">SKIP: <b id="statSkip" style="color:#fbbf24">0</b></div>
      <div class="stat-pill">ERROR: <b id="statError" style="color:#fca5a5">0</b></div>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <select id="levelFilter">
        <option value="ALL">🔍 Tất cả level (ALL)</option>
        <option value="PASS">✅ Chỉ PASS (Đạt tiêu chuẩn)</option>
        <option value="SKIP">⏭️ Chỉ SKIP (Bỏ qua)</option>
        <option value="ERROR">❌ Chỉ ERROR (Lỗi)</option>
        <option value="SAVED">💾 Chỉ SAVED (Đã lưu Sheet)</option>
        <option value="RUNNING">⚡ RUNNING (Đang chạy)</option>
        <option value="WARN">⚠️ WARN (Cảnh báo)</option>
        <option value="INFO">ℹ️ INFO (Thông tin)</option>
      </select>
      <input type="text" id="searchInput" placeholder="🔎 Tìm từ khóa trong log..." style="width:220px">
    </div>
    <div class="toolbar-right">
      <label class="toggle-scroll">
        <input type="checkbox" id="autoScrollCheck" checked style="accent-color:#6366f1">
        Tự cuộn xuống dòng mới
      </label>
      <button type="button" class="btn" id="btnCopy">📋 Sao chép Log</button>
      <button type="button" class="btn" id="btnExport">💾 Tải file .log</button>
      <button type="button" class="btn btn-danger" id="btnClear">🗑️ Xóa Log</button>
    </div>
  </div>

  <!-- Log Area -->
  <main class="log-container" id="logContainer">
    <div style="color:#475569;text-align:center;padding:40px 0">
      Đang kết nối nhật ký logfile...
    </div>
  </main>
</div>

<script src="log.js"></script>
</body>
</html>
